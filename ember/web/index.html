<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ember</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ef8a4a'/%3E%3C/svg%3E">

<body>

<div id="stage">
  <div id="canvas">
    <!-- The header stays put when the slide changes - it carries the
         clock, and it is the one part of the screen that does not
         change. -->
    <div id="head" class="slide-head"></div>
    <!-- The deck is where the slides live, and where one slides in
         over the top of the one it replaces. -->
    <div id="deck"></div>
  </div>
</div>

</body>
